<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/setting.css">
  <script src="../js/setting.js"></script>
</head>
<body>
  <div class="container">
    <div class="left">
      <img src="../logo/ChatGPT Image Jul 23, 2025, 10_58_27 PM.png" alt="Logo" class="main-logo" />
      <div class="bouton"><a href="Dashboard.html">Dashboard</a></div>
      <div class="bouton"><a href="product.html">Product</a></div>
      <div class="bouton"><a href="order.html">Orders</a></div>
      <div class="bouton"><a href="setting.html">Settings</a></div>
    </div>

    <div class="right">
      <div class="settings-box">
        <h1>Settings</h1>

        <div class="setting-item">
          <label for="language">Language:</label>
          <select id="language">
            <option value="en" selected>English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
          </select>
        </div>

        <div class="setting-item">
          <label for="currency">Currency:</label>
          <select id="currency">
            <option value="usd" selected>USD ($)</option>
            <option value="eur">EUR (€)</option>
            <option value="fcfa">FCFA (₣)</option>
          </select>
        </div>

        <div class="setting-item">
          <label for="theme">Theme:</label>
          <select id="theme">
            <option value="light" selected>Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
